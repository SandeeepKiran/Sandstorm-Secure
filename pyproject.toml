[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandstorm"
version = "0.4.0"
description = "Local Android phone-management (MDM) CLI and dashboard built on Google Android Management API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.100.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "jinja2>=3.1.0",
    "pillow>=10.0.0",
    "qrcode>=7.4.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.24.0",
    "playwright>=1.40.0",
    "pytest>=7.4.0",
]

[project.scripts]
sandstorm = "sandstorm.cli:main"

[tool.setuptools.packages.find]
include = ["sandstorm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
